dataset:
  name: "cifar100"
  num_classes: 100
  data_dir: "./data"
  val_split: 0.1 # 10% of training set (5,000 images) for validation
  test_split: 10000 # official CIFAR-100 test set
  seed: 42
  num_workers: 2
  pin_memory: true

  # Native resolution for Custom CNN
  native_size: [32, 32]
  # Standard resolution for Pretrained backbones
  pretrained_size: [224, 224]

  # CIFAR-100 Statistics
  cifar_mean: [0.5071, 0.4867, 0.4408]
  cifar_std: [0.2675, 0.2565, 0.2761]

  # ImageNet Statistics for pretrained weights
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

  # Augmentation parameters
  augmentation:
    random_crop_padding: 4
    random_horizontal_flip: 0.5
    random_rotation_degrees: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2

  # Smoke test configuration
  smoke_test:
    enabled: false
    subset_size_train: 128
    subset_size_val: 64
    subset_size_test: 64
